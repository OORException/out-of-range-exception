<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="topbar">
<header class="sticky top-0 z-50 border-b border-slate-200/80 bg-white/90 backdrop-blur-md">
    <div class="content-shell px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center gap-6 md:gap-8">
                <a th:href="@{/home}" class="flex items-center gap-3 font-bold text-lg text-slate-900 hover:text-brand-700 transition-colors">
                    <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-brand-100 text-[11px] font-extrabold tracking-wider text-brand-700">FO</span>
                    <span class="font-heading">Forum Online</span>
                </a>
                <nav class="hidden md:flex items-center gap-1">
                    <a th:href="@{/home}" class="px-3 py-2 rounded-md text-sm font-semibold text-slate-700 hover:bg-slate-100 hover:text-slate-900">Início</a>
                    <a th:href="@{/forum}" class="px-3 py-2 rounded-md text-sm font-semibold text-slate-600 hover:bg-slate-100 hover:text-slate-900">Fórum</a>
                    <a th:href="@{/forum/topics/new}"
                       sec:authorize="isAuthenticated()"
                       class="px-3 py-2 rounded-md text-sm font-semibold text-slate-600 hover:bg-slate-100 hover:text-slate-900">
                       Novo tópico
                    </a>
                </nav>
            </div>
            <div class="flex items-center gap-3">
                <!-- Links para não autenticados -->
                <a sec:authorize="!isAuthenticated()"
                         id="topbar-login-link"
                   th:href="@{/auth/login}"
                   class="px-4 py-2 text-sm font-semibold text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors">
                    Entrar
                </a>
                <a sec:authorize="!isAuthenticated()"
                         id="topbar-register-link"
                   th:href="@{/auth/register}"
                   class="px-4 py-2 text-sm font-semibold text-white bg-brand-600 rounded-lg hover:bg-brand-700 transition-colors">
                    Registrar
                </a>

                <!-- Menu do usuário autenticado -->
                <div sec:authorize="isAuthenticated()" class="relative">
                    <button id="topbar-user-button" type="button" aria-label="Menu do usuário"
                            class="w-9 h-9 rounded-full border border-slate-200 bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-600 hover:bg-slate-200 transition-colors">
                        USR
                    </button>
                    <div id="topbar-user-dropdown"
                         class="hidden absolute right-0 mt-2 w-52 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl py-2 z-50">
                        <div class="px-4 py-2 border-b border-slate-100">
                            <p class="text-xs text-slate-400">Logado como</p>
                            <p class="text-sm font-semibold text-slate-900" sec:authentication="name">usuario</p>
                        </div>
                        <a th:href="@{/profile}" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-100">
                            Meu Perfil
                        </a>
                        <a sec:authorize="hasRole('ADMIN')"
                           th:href="@{/admin/categories}"
                           class="block px-4 py-2 text-sm font-semibold text-rose-600 hover:bg-rose-50">
                            Painel Admin
                        </a>
                        <form th:action="@{/auth/logout}" method="post" class="block">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-100">
                                Sair
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
<script>
    (function () {
        const logoutForm = document.querySelector('form[action="/auth/logout"]');
        logoutForm?.addEventListener('submit', function () {
            localStorage.removeItem('token');
        });

        const btn = document.getElementById('topbar-user-button');
        const dropdown = document.getElementById('topbar-user-dropdown');
        if (!btn || !dropdown) return;

        btn.addEventListener('click', function (e) {
            e.stopPropagation();
            dropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', function (e) {
            if (!btn.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });
    })();
</script>
</th:block>
</body>
</html>
