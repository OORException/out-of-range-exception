<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="topbar">
<header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center gap-8">
                <a th:href="@{/home}" class="flex items-center gap-2 font-bold text-xl text-blue-600 hover:text-blue-700">
                    <span class="text-2xl">💬</span>
                    <span>FórumOnline</span>
                </a>
                <nav class="hidden md:flex items-center gap-1">
                    <a th:href="@{/home}" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100 hover:text-gray-900">Início</a>
                    <a th:href="@{/forum}" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900">Fórum</a>
                    <a th:href="@{/forum/topics/new}"
                       sec:authorize="isAuthenticated()"
                       class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900">
                       Novo tópico
                    </a>
                </nav>
            </div>
            <div class="flex items-center gap-3">
                <!-- Links para não autenticados -->
                <a sec:authorize="!isAuthenticated()"
                         id="topbar-login-link"
                   th:href="@{/auth/login}"
                   class="px-4 py-2 text-sm font-medium text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                    Entrar
                </a>
                <a sec:authorize="!isAuthenticated()"
                         id="topbar-register-link"
                   th:href="@{/auth/register}"
                   class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors">
                    Registrar
                </a>

                <!-- Menu do usuário autenticado -->
                <div sec:authorize="isAuthenticated()" class="relative">
                    <button id="topbar-user-button" type="button" aria-label="Menu do usuário"
                            class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-sm hover:bg-blue-200 transition-colors">
                        👤
                    </button>
                    <div id="topbar-user-dropdown"
                         class="hidden absolute right-0 mt-2 w-48 overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-lg py-2 z-50">
                        <div class="px-4 py-2 border-b border-gray-100">
                            <p class="text-xs text-gray-400">Logado como</p>
                            <p class="text-sm font-medium text-gray-900" sec:authentication="name">usuário</p>
                        </div>
                        <a th:href="@{/profile}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                            Meu Perfil
                        </a>
                        <a sec:authorize="hasRole('ADMIN')"
                           th:href="@{/admin/categories}"
                           class="block px-4 py-2 text-sm font-semibold text-red-600 hover:bg-red-50">
                            Painel Admin
                        </a>
                        <form th:action="@{/auth/logout}" method="post" class="block">
                            <button type="submit" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                Sair
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
<script>
    (function () {
        const logoutForm = document.querySelector('form[action="/auth/logout"]');
        logoutForm?.addEventListener('submit', function () {
            localStorage.removeItem('token');
        });

        const btn = document.getElementById('topbar-user-button');
        const dropdown = document.getElementById('topbar-user-dropdown');
        if (!btn || !dropdown) return;

        btn.addEventListener('click', function (e) {
            e.stopPropagation();
            dropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', function (e) {
            if (!btn.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });
    })();
</script>
</th:block>
</body>
</html>
