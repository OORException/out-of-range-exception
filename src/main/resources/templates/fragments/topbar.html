<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="topbar">
<header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center gap-8">
                <a th:href="@{/}" class="flex items-center gap-2 font-bold text-xl text-blue-600 hover:text-blue-700">
                    <span class="text-2xl">💬</span>
                    <span>FórumOnline</span>
                </a>
                <nav class="hidden md:flex items-center gap-1">
                    <a th:href="@{/}" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100 hover:text-gray-900">Início</a>
                    <a th:href="@{/}" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900">Categorias</a>
                    <a th:href="@{/}" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900">Chats</a>
                    <!-- Links de administração: visíveis apenas para ROLE_ADMIN -->
                    <span id="topbar-admin-divider" class="hidden text-gray-300 select-none">|</span>
                    <a id="topbar-admin-categories" th:href="@{/admin/categories}" class="hidden px-3 py-2 rounded-md text-sm font-medium text-red-600 hover:bg-red-50 hover:text-red-700">Categorias</a>
                    <a id="topbar-admin-tags" th:href="@{/admin/tags}" class="hidden px-3 py-2 rounded-md text-sm font-medium text-red-600 hover:bg-red-50 hover:text-red-700">Tags</a>
                    <a id="topbar-admin-topics" th:href="@{/admin/topics}" class="hidden px-3 py-2 rounded-md text-sm font-medium text-red-600 hover:bg-red-50 hover:text-red-700">Tópicos</a>
                    <a id="topbar-admin-users" th:href="@{/admin/users}" class="hidden px-3 py-2 rounded-md text-sm font-medium text-red-600 hover:bg-red-50 hover:text-red-700">Usuários</a>
                </nav>
            </div>
            <div class="flex items-center gap-3">
                <a id="topbar-login-link" th:href="@{/auth/login}" class="px-4 py-2 text-sm font-medium text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                    Entrar
                </a>
                <a id="topbar-register-link" th:href="@{/auth/register}" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors">
                    Registrar
                </a>
                <div id="topbar-user-menu-wrapper" class="relative hidden">
                    <button id="topbar-user-button" type="button" aria-label="Menu do usuário" class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-sm hover:bg-blue-200 transition-colors">
                        👤
                    </button>
                    <div id="topbar-user-dropdown" class="hidden absolute right-0 mt-2 w-44 overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-lg py-2 z-50">
                        <a href="/profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Meu Perfil</a>
                        <a id="topbar-admin-panel-link" href="/admin" class="hidden px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50">Painel Admin</a>
                        <button id="topbar-logout-button" type="button" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
<script th:inline="none">
    (function () {
        const token = localStorage.getItem('token');
        const loginLink = document.getElementById('topbar-login-link');
        const registerLink = document.getElementById('topbar-register-link');
        const menuWrapper = document.getElementById('topbar-user-menu-wrapper');
        const menuButton = document.getElementById('topbar-user-button');
        const menuDropdown = document.getElementById('topbar-user-dropdown');
        const logoutButton = document.getElementById('topbar-logout-button');

        function decodeTokenPayload(t) {
            try {
                const base64 = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(atob(base64));
            } catch {
                return null;
            }
        }

        if (token) {
            loginLink?.classList.add('hidden');
            registerLink?.classList.add('hidden');
            menuWrapper?.classList.remove('hidden');

            const payload = decodeTokenPayload(token);
            const isAdmin = payload?.roles?.includes('ROLE_ADMIN');

            if (isAdmin) {
                document.getElementById('topbar-admin-divider')?.classList.remove('hidden');
                document.getElementById('topbar-admin-categories')?.classList.remove('hidden');
                document.getElementById('topbar-admin-tags')?.classList.remove('hidden');
                document.getElementById('topbar-admin-users')?.classList.remove('hidden');
                document.getElementById('topbar-admin-panel-link')?.classList.remove('hidden');
                document.getElementById('topbar-admin-panel-link')?.classList.add('block');
            }
        }

        menuButton?.addEventListener('click', function (event) {
            event.stopPropagation();
            menuDropdown?.classList.toggle('hidden');
        });

        document.addEventListener('click', function (event) {
            if (menuWrapper && !menuWrapper.contains(event.target)) {
                menuDropdown?.classList.add('hidden');
            }
        });

        logoutButton?.addEventListener('click', async function () {
            const currentToken = localStorage.getItem('token');
            if (currentToken) {
                await fetch('/api/v1/auth/logout', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });
            }
            localStorage.removeItem('token');
            window.location.href = '/auth/login';
        });
    })();
</script>
</th:block>
</body>
</html>
