<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Fórum')}"></head>
  <body class="bg-gray-50 min-h-screen flex flex-col">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center gap-8">
            <a
              th:href="@{/}"
              class="flex items-center gap-2 font-bold text-xl text-blue-600 hover:text-blue-700"
            >
              <span class="text-2xl">💬</span>
              <span>FórumOnline</span>
            </a>
            <nav class="hidden md:flex items-center gap-1">
              <a
                th:href="@{/home}"
                class="px-3 py-2 rounded-md text-sm font-medium text-gray-900 bg-gray-100"
                >Início</a
              >
              <a
                th:href="@{/}"
                class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900"
                >Categorias</a
              >
              <a
                th:href="@{/}"
                class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900"
                >Chats</a
              >
              <span id="home-admin-divider" class="hidden text-gray-300 select-none">|</span>
              <a id="home-admin-categories" th:href="@{/admin/categories}" class="hidden px-3 py-2 rounded-md text-sm font-medium text-red-600 hover:bg-red-50 hover:text-red-700">Categorias</a>
              <a id="home-admin-tags" th:href="@{/admin/tags}" class="hidden px-3 py-2 rounded-md text-sm font-medium text-red-600 hover:bg-red-50 hover:text-red-700">Tags</a>
              <a id="home-admin-users" th:href="@{/admin/users}" class="hidden px-3 py-2 rounded-md text-sm font-medium text-red-600 hover:bg-red-50 hover:text-red-700">Usuários</a>
            </nav>
          </div>
          <div class="flex items-center gap-3">
            <a
              id="home-login-link"
              th:href="@{/auth/login}"
              class="px-4 py-2 text-sm font-medium text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors"
            >
              Entrar
            </a>
            <a
              id="home-register-link"
              th:href="@{/auth/register}"
              class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors"
            >
              Registrar
            </a>
            <div id="home-auth-actions" class="hidden items-center gap-3">
              <a
                th:href="@{/forum/topics/new}"
                class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors"
              >
                Criar Novo Tópico
              </a>
              <button
                type="button"
                aria-label="Mensagens"
                class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition-colors"
              >
                💬
              </button>
              <button
                type="button"
                aria-label="Notificações"
                class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition-colors"
              >
                🔔
              </button>
              <div id="home-user-menu-wrapper" class="relative">
                <button
                  id="home-user-button"
                  type="button"
                  aria-label="Menu do usuário"
                  class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-sm hover:bg-blue-200 transition-colors"
                >
                  👤
                </button>
                <div
                  id="home-user-dropdown"
                  class="hidden absolute right-0 mt-2 w-44 overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-lg py-2 z-50"
                >
                  <a
                    href="/profile"
                    class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
                    >Meu Perfil</a
                  >
                  <a
                    id="home-admin-panel-link"
                    href="/admin"
                    class="hidden px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50"
                    >Painel Admin</a
                  >
                  <button
                    id="home-logout-button"
                    type="button"
                    class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
                  >
                    Logout
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
    <script>
      (function () {
        const token = localStorage.getItem("token");
        const loginLink = document.getElementById("home-login-link");
        const registerLink = document.getElementById("home-register-link");
        const authActions = document.getElementById("home-auth-actions");
        const menuWrapper = document.getElementById("home-user-menu-wrapper");
        const menuButton = document.getElementById("home-user-button");
        const menuDropdown = document.getElementById("home-user-dropdown");
        const logoutButton = document.getElementById("home-logout-button");

        function decodeTokenPayload(t) {
          try {
            const base64 = t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
            return JSON.parse(atob(base64));
          } catch {
            return null;
          }
        }

        if (token) {
          loginLink?.classList.add("hidden");
          registerLink?.classList.add("hidden");
          authActions?.classList.remove("hidden");
          authActions?.classList.add("flex");

          const payload = decodeTokenPayload(token);
          const isAdmin = payload?.roles?.includes("ROLE_ADMIN");

          if (isAdmin) {
            document.getElementById("home-admin-divider")?.classList.remove("hidden");
            document.getElementById("home-admin-categories")?.classList.remove("hidden");
            document.getElementById("home-admin-tags")?.classList.remove("hidden");
            document.getElementById("home-admin-users")?.classList.remove("hidden");
            document.getElementById("home-admin-panel-link")?.classList.remove("hidden");
            document.getElementById("home-admin-panel-link")?.classList.add("block");
          }
        }

        menuButton?.addEventListener("click", function (event) {
          event.stopPropagation();
          menuDropdown?.classList.toggle("hidden");
        });

        document.addEventListener("click", function (event) {
          if (menuWrapper && !menuWrapper.contains(event.target)) {
            menuDropdown?.classList.add("hidden");
          }
        });

        logoutButton?.addEventListener("click", async function () {
          const currentToken = localStorage.getItem("token");
          if (currentToken) {
            await fetch("/api/v1/auth/logout", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${currentToken}`,
              },
            });
          }
          localStorage.removeItem("token");
          window.location.href = "/auth/login";
        });
      })();
    </script>

    <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
      <div class="flex flex-col lg:flex-row gap-8">
        <!-- Coluna principal -->
        <div class="flex-1 min-w-0 space-y-8">
          <!-- Tópicos Populares -->
          <section>
            <h1 class="text-2xl font-bold text-gray-900 mb-5">
              Tópicos Populares e Recentes
            </h1>

            <div th:if="${#lists.isEmpty(topicCards)}" class="text-gray-500 text-sm">
              Nenhum tópico encontrado.
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <article
                th:each="topic : ${topicCards}"
                class="bg-white rounded-xl border border-gray-200 p-5 hover:shadow-md transition-shadow"
              >
                <a
                  th:href="@{/forum/topics/{id}(id=${topic.id})}"
                  th:text="${topic.categoryName}"
                  class="inline-block text-xs font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full mb-2 hover:bg-blue-100"
                ></a>
                <h2 class="text-base font-semibold text-gray-900 mb-3">
                  <a
                    th:href="@{/forum/topics/{id}(id=${topic.id})}"
                    th:text="${topic.title}"
                    class="hover:text-blue-600"
                  ></a>
                </h2>
                <div class="flex items-center gap-3 text-xs text-gray-500">
                  <span th:text="${topic.postCount + ' postagens'}"></span>
                  <span>·</span>
                  <span th:text="${'última ' + topic.lastActivityLabel}"></span>
                </div>
              </article>
            </div>
          </section>

          <!-- Chats em Tempo Real -->
          <section>
            <h2 class="text-xl font-bold text-gray-900 mb-4">
              Chats em Tempo Real
            </h2>

            <div th:if="${#lists.isEmpty(chatCards)}" class="text-gray-500 text-sm">
              Nenhum chat ativo no momento.
            </div>

            <div class="space-y-3">
              <article
                th:each="chat : ${chatCards}"
                class="bg-white rounded-xl border border-gray-200 p-4 flex items-center justify-between gap-4 hover:shadow-md transition-shadow"
              >
                <div class="flex items-center gap-4 min-w-0">
                  <span class="text-2xl shrink-0">💬</span>
                  <div class="min-w-0">
                    <h3 class="font-semibold text-gray-900 text-sm">
                      <a
                        th:href="@{/chat/{id}(id=${chat.id})}"
                        th:text="${chat.name}"
                        class="hover:text-blue-600"
                      ></a>
                    </h3>
                    <p
                      th:text="${'Tópico: ' + chat.topicTitle}"
                      class="text-xs text-gray-500 truncate"
                    ></p>
                  </div>
                </div>
                <div class="flex items-center gap-3 shrink-0">
                  <span
                    class="flex items-center gap-1.5 text-xs text-green-600 font-medium"
                  >
                    <span
                      class="w-2 h-2 rounded-full bg-green-500 animate-pulse"
                    ></span>
                    <span th:text="${chat.participantCount + ' Online'}"></span>
                  </span>
                  <a
                    th:href="@{/chat/{id}(id=${chat.id})}"
                    class="px-3 py-1.5 text-xs font-medium text-blue-600 border border-blue-200 rounded-lg hover:bg-blue-50 transition-colors"
                    >Entrar</a
                  >
                </div>
              </article>
            </div>
          </section>
        </div>

        <!-- Sidebar -->
        <aside class="w-full lg:w-72 shrink-0 space-y-5">
          <!-- Busca -->
          <div class="bg-white rounded-xl border border-gray-200 p-4">
            <form action="#" method="get">
              <label class="sr-only" for="q">Pesquisar</label>
              <input
                id="q"
                name="q"
                type="search"
                placeholder="Procure um tópico ou chat..."
                class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </form>
          </div>

          <!-- Em Alta -->
          <div class="bg-white rounded-xl border border-gray-200 p-4">
            <h2
              class="text-sm font-bold text-gray-900 mb-3 flex items-center gap-2"
            >
              <span>🔥</span> Em Alta
            </h2>
            <ul class="space-y-2">
              <li th:each="topic : ${trendingTopics}">
                <a
                  th:href="@{/forum/topics/{id}(id=${topic.id})}"
                  th:text="${topic.title}"
                  class="text-sm text-gray-700 hover:text-blue-600 line-clamp-2"
                ></a>
              </li>
              <li th:if="${#lists.isEmpty(trendingTopics)}" class="text-sm text-gray-500">
                Nenhum tópico em destaque.
              </li>
            </ul>
          </div>
        </aside>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
