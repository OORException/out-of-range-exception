<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Acesso negado')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div th:replace="~{fragments/topbar :: topbar}"></div>
<main class="flex-1 flex items-center justify-center px-4 py-20">
  <div class="text-center max-w-md">
    <div class="text-8xl font-extrabold text-red-500 mb-4">403</div>
    <h1 class="text-2xl font-semibold text-gray-900 mb-3">Acesso negado</h1>
    <p class="text-gray-500 mb-2" th:text="${message != null ? message : 'Você não tem permissão para acessar esta página.'}"></p>
    <p class="text-gray-400 text-sm mb-8">Faça login com uma conta com as permissões necessárias.</p>
    <div class="flex gap-3 justify-center">
      <a th:href="@{/home}" class="inline-flex items-center gap-2 px-6 py-3 bg-blue-600 text-white text-sm font-medium rounded-xl hover:bg-blue-700 transition-colors">
        ← Voltar ao início
      </a>
      <a th:href="@{/auth/login}" class="inline-flex items-center gap-2 px-6 py-3 border border-gray-300 text-gray-700 text-sm font-medium rounded-xl hover:bg-gray-50 transition-colors">
        Fazer login
      </a>
    </div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
