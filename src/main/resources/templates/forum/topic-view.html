<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head(${topic.title})}"></head>
  <body class="min-h-screen flex flex-col text-slate-800">

    <div th:replace="~{fragments/topbar :: topbar}"></div>

    <main class="flex-1 content-shell max-w-4xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 space-y-6">

      <!-- Breadcrumb -->
      <nav class="text-sm text-gray-500 flex items-center gap-1.5">
        <a th:href="@{/home}" class="hover:text-gray-700">Início</a>
        <span>›</span>
        <span th:text="${categoryName}" class="hover:text-gray-700"></span>
        <span>›</span>
        <span class="text-gray-800 font-medium truncate max-w-xs" th:text="${topic.title}"></span>
      </nav>

      <!-- Cabeçalho do tópico -->
      <div class="surface-card p-6">
        <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
          <div class="flex-1 min-w-0">
            <!-- Categoria -->
            <span
              class="inline-block text-xs font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full mb-3"
              th:text="${categoryName}"
            ></span>

            <!-- Título -->
            <h1 class="text-xl font-bold text-gray-900 mb-3" th:text="${topic.title}"></h1>

            <!-- Descrição -->
            <p
              th:if="${topic.description != null and !#strings.isEmpty(topic.description)}"
              th:text="${topic.description}"
              class="text-sm text-gray-600 leading-relaxed mb-4 whitespace-pre-wrap"
            ></p>

            <!-- Tags -->
            <div th:if="${!#lists.isEmpty(tags)}" class="flex flex-wrap gap-2 mb-4">
              <span
                th:each="tag : ${tags}"
                th:text="${tag.name}"
                class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600"
              ></span>
            </div>

            <!-- Meta -->
            <div class="flex flex-wrap items-center gap-4 text-xs text-gray-400">
              <span th:text="${'Criado em ' + createdAt}"></span>
              <span>·</span>
              <span th:text="${topic.viewCount + ' visualizações'}"></span>
              <span>·</span>
              <span th:text="${#lists.size(posts) + ' respostas'}"></span>
            </div>
          </div>

          <!-- Botão do chat -->
          <div class="shrink-0 flex flex-col sm:items-end gap-2">
            <a
              th:href="@{/forum/topics/new}"
              class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors"
            >
              + Nova Pergunta
            </a>

            <a
              th:if="${chatId != null}"
              th:href="@{/chat/{id}(id=${chatId})}"
              class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-blue-600 border border-blue-200 rounded-lg hover:bg-blue-50 transition-colors"
            >
              Entrar no Chat
            </a>

            <button
              th:if="${chatId == null}"
              id="create-chat-btn"
              class="hidden inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            >
              Criar Chat
            </button>
          </div>
        </div>
      </div>

      <!-- Lista de posts -->
      <section>
        <h2 class="text-base font-semibold text-gray-700 mb-3"
            th:text="${#lists.size(posts) + ' Resposta(s)'}"></h2>

        <!-- Estado vazio -->
        <div
          th:if="${#lists.isEmpty(posts)}"
          class="surface-card p-8 text-center text-gray-400 text-sm"
        >
          Nenhuma resposta ainda. Seja o primeiro a responder!
        </div>

        <div class="space-y-4">
          <article
            th:each="post, iter : ${posts}"
            th:id="'post-' + ${post.id}"
            class="surface-card p-5"
          >
            <div class="flex items-start gap-4">
              <!-- Avatar -->
              <div class="w-9 h-9 rounded-full bg-blue-100 flex items-center justify-center text-sm font-bold text-blue-600 shrink-0"
                   th:text="${#strings.substring(post.authorUsername, 0, 1).toUpperCase()}">
              </div>

              <div class="flex-1 min-w-0">
                <!-- Cabeçalho do post -->
                <div class="flex items-center justify-between gap-2 mb-2">
                  <div class="flex items-center gap-2 text-sm">
                    <span class="font-semibold text-gray-900" th:text="${post.authorUsername}"></span>
                    <span class="text-gray-400" th:text="${post.createdAt}"></span>
                    <span
                      th:if="${post.updatedAt != null}"
                      class="text-xs text-gray-400 italic"
                    >(editado)</span>
                  </div>
                  <!-- Ações do post (visíveis via JS para autor/admin) -->
                  <div
                    th:data-post-id="${post.id}"
                    th:data-author-id="${post.authorId}"
                    class="post-actions hidden flex items-center gap-2"
                  >
                    <button
                      th:data-post-id="${post.id}"
                      class="edit-btn text-xs text-gray-500 hover:text-blue-600 transition-colors"
                    >Editar</button>
                    <button
                      th:data-post-id="${post.id}"
                      class="delete-btn text-xs text-gray-500 hover:text-red-600 transition-colors"
                    >Excluir</button>
                  </div>
                </div>

                <!-- Conteúdo -->
                <div
                  th:id="'content-' + ${post.id}"
                  th:text="${post.content}"
                  class="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap mb-3"
                ></div>

                <!-- Formulário de edição (oculto) -->
                <div th:id="'edit-form-' + ${post.id}" class="hidden mb-3">
                  <textarea
                    th:id="'edit-textarea-' + ${post.id}"
                    maxlength="5000"
                    rows="4"
                    class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"
                    th:text="${post.content}"
                  ></textarea>
                  <div class="flex gap-2 mt-2">
                    <button
                      th:data-post-id="${post.id}"
                      class="save-edit-btn px-3 py-1.5 text-xs font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors"
                    >Salvar</button>
                    <button
                      th:data-post-id="${post.id}"
                      class="cancel-edit-btn px-3 py-1.5 text-xs font-medium text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors"
                    >Cancelar</button>
                  </div>
                </div>

                <!-- Rodapé do post: likes -->
                <div class="flex items-center gap-4">
                  <button
                    th:data-post-id="${post.id}"
                    class="like-btn flex items-center gap-1.5 text-xs text-gray-500 hover:text-red-500 transition-colors"
                  >
                    <span class="like-icon">Curtir</span>
                    <span th:id="'like-count-' + ${post.id}" th:text="${post.likeCount}"></span>
                  </button>
                </div>
              </div>
            </div>
          </article>
        </div>
      </section>

      <!-- Área de resposta -->
      <section id="reply-section" class="hidden">
        <h2 class="text-base font-semibold text-gray-700 mb-3">Sua Resposta</h2>
        <div class="surface-card p-5">
          <div id="reply-error" class="hidden mb-3 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700"></div>
          <textarea
            id="reply-content"
            maxlength="5000"
            rows="5"
            placeholder="Escreva sua resposta…"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y mb-2"
          ></textarea>
          <div class="flex items-center justify-between">
            <span class="text-xs text-gray-400"><span id="reply-count">0</span>/5000</span>
            <button
              id="reply-submit"
              class="px-5 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            >Responder</button>
          </div>
        </div>
      </section>

      <!-- Prompt de login para não autenticados -->
      <div id="login-prompt" class="hidden surface-card p-6 text-center">
        <p class="text-sm text-gray-600 mb-3">Faça login para deixar sua resposta.</p>
        <a th:href="@{/auth/login}" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors">
          Entrar
        </a>
      </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script th:inline="javascript">
      /*<![CDATA[*/
      (function () {
        const topicId = /*[[${topic.id}]]*/ 0;
        let currentUser = null;
        let isAuthenticated = false;
        let isAdmin = false;

        function jsonHeaders() {
          return { 'Content-Type': 'application/json' };
        }

        async function loadCurrentUser() {
          try {
            const res = await fetch('/api/v1/users/me', { headers: { 'Accept': 'application/json' } });
            if (!res.ok) return null;
            return await res.json();
          } catch {
            return null;
          }
        }

        // ── Autenticação ──────────────────────────────────────────────
        loadCurrentUser().then(user => {
          currentUser = user;
          isAuthenticated = !!user;
          isAdmin = (user?.level === 'ADMIN');

          if (!isAuthenticated) {
            document.getElementById('login-prompt')?.classList.remove('hidden');
            return;
          }

          document.getElementById('login-prompt')?.classList.add('hidden');

          document.getElementById('reply-section')?.classList.remove('hidden');
          document.getElementById('create-chat-btn')?.classList.remove('hidden');

          // Mostrar ações de editar/excluir nos posts do usuário atual
          document.querySelectorAll('.post-actions').forEach(el => {
            const authorId = Number(el.dataset.authorId);
            if (isAdmin || currentUser.id === authorId) {
              el.classList.remove('hidden');
              el.classList.add('flex');
            }
          });

          // Carregar estados dos likes
          document.querySelectorAll('.like-btn').forEach(btn => {
            const postId = btn.dataset.postId;
            fetch('/api/v1/posts/' + postId + '/likes/check')
              .then(r => r.ok ? r.json() : false)
              .then(liked => {
                btn.querySelector('.like-icon').textContent = liked ? 'Curtido' : 'Curtir';
                btn.dataset.liked = liked;
              }).catch(() => {});
          });
        });

        // ── Criar chat para o tópico ────────────────────────────────
        document.getElementById('create-chat-btn')?.addEventListener('click', async () => {
          if (!isAuthenticated) { window.location.href = '/auth/login'; return; }
          const btn = document.getElementById('create-chat-btn');
          btn.disabled = true;
          btn.textContent = 'Criando chat…';
          try {
            const res = await fetch('/api/v1/chats/topic/' + topicId, {
              method: 'POST',
              headers: jsonHeaders()
            });
            if (!res.ok) throw new Error();
            const chatId = await res.json();
            window.location.href = '/chat/' + chatId;
          } catch {
            btn.disabled = false;
            btn.textContent = 'Criar Chat';
            alert('Não foi possível criar o chat para este tópico.');
          }
        });

        // ── Likes ──────────────────────────────────────────────────────
        document.querySelectorAll('.like-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!isAuthenticated) { window.location.href = '/auth/login'; return; }
            const postId = btn.dataset.postId;
            const liked = btn.dataset.liked === 'true';
            const method = liked ? 'DELETE' : 'POST';
            try {
              const res = await fetch('/api/v1/posts/' + postId + '/likes', {
                method, headers: jsonHeaders()
              });
              if (!res.ok) return;
              const countEl = document.getElementById('like-count-' + postId);
              const current = parseInt(countEl.textContent) || 0;
              countEl.textContent = liked ? current - 1 : current + 1;
              btn.dataset.liked = !liked;
              btn.querySelector('.like-icon').textContent = liked ? 'Curtir' : 'Curtido';
            } catch {}
          });
        });

        // ── Contador de resposta ──────────────────────────────────────
        document.getElementById('reply-content')?.addEventListener('input', function () {
          document.getElementById('reply-count').textContent = this.value.length;
        });

        // ── Submit de resposta ─────────────────────────────────────────
        document.getElementById('reply-submit')?.addEventListener('click', async () => {
          const content = document.getElementById('reply-content').value.trim();
          const errorEl = document.getElementById('reply-error');
          errorEl.classList.add('hidden');

          if (!content) {
            errorEl.textContent = 'A resposta não pode estar vazia.';
            errorEl.classList.remove('hidden');
            return;
          }

          const btn = document.getElementById('reply-submit');
          btn.disabled = true;
          btn.textContent = 'Enviando…';

          try {
            const res = await fetch('/api/v1/posts', {
              method: 'POST',
              headers: jsonHeaders(),
              body: JSON.stringify({ topicId, content })
            });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              throw new Error(err.message || 'Erro ao enviar resposta.');
            }
            window.location.reload();
          } catch (err) {
            errorEl.textContent = err.message;
            errorEl.classList.remove('hidden');
            btn.disabled = false;
            btn.textContent = 'Responder';
          }
        });

        // ── Editar post ────────────────────────────────────────────────
        document.querySelectorAll('.edit-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const postId = btn.dataset.postId;
            document.getElementById('content-' + postId)?.classList.add('hidden');
            document.getElementById('edit-form-' + postId)?.classList.remove('hidden');
          });
        });

        document.querySelectorAll('.cancel-edit-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const postId = btn.dataset.postId;
            document.getElementById('edit-form-' + postId)?.classList.add('hidden');
            document.getElementById('content-' + postId)?.classList.remove('hidden');
          });
        });

        document.querySelectorAll('.save-edit-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const postId = btn.dataset.postId;
            const content = document.getElementById('edit-textarea-' + postId).value.trim();
            if (!content) return;
            btn.disabled = true;
            try {
              const res = await fetch('/api/v1/posts/' + postId, {
                method: 'PATCH',
                headers: jsonHeaders(),
                body: JSON.stringify({ content })
              });
              if (!res.ok) throw new Error();
              document.getElementById('content-' + postId).textContent = content;
              document.getElementById('edit-form-' + postId)?.classList.add('hidden');
              document.getElementById('content-' + postId)?.classList.remove('hidden');
            } catch {
              btn.disabled = false;
            }
          });
        });

        // ── Excluir post ───────────────────────────────────────────────
        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('Tem certeza que deseja excluir esta resposta?')) return;
            const postId = btn.dataset.postId;
            try {
              const res = await fetch('/api/v1/posts/' + postId, {
                method: 'DELETE',
                headers: jsonHeaders()
              });
              if (res.ok) {
                document.getElementById('post-' + postId)?.remove();
              }
            } catch {}
          });
        });
      })();
      /*]]>*/
    </script>
  </body>
</html>
