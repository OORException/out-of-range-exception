<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Meu Perfil')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="flex-1 max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10">

  <!-- Flash messages -->
  <div th:if="${successMessage}" class="mb-6 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-green-700">
    <p th:text="${successMessage}"></p>
  </div>
  <div th:if="${errorMessage}" class="mb-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-red-700">
    <p th:text="${errorMessage}"></p>
  </div>

  <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden">

    <!-- Header do perfil -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 px-8 py-10 text-white">
      <div class="flex flex-col gap-3">
        <p class="text-sm uppercase tracking-[0.25em] text-blue-100">Meu Perfil</p>
        <h1 class="text-3xl sm:text-4xl font-semibold">
          Olá, <span th:text="${user.fullName}">Usuário</span>
        </h1>
        <p class="max-w-2xl text-sm sm:text-base text-blue-100/90">
          Gerencie suas informações de conta.
        </p>
      </div>
    </div>

    <div class="p-8">
      <!-- Cards de informação -->
      <div class="grid gap-6 sm:grid-cols-2 mb-8">
        <div class="rounded-3xl border border-gray-200 p-6 bg-gray-50">
          <p class="text-sm text-gray-500 uppercase tracking-wide">Nome completo</p>
          <p class="mt-2 text-xl font-semibold text-gray-900" th:text="${user.fullName}"></p>
        </div>
        <div class="rounded-3xl border border-gray-200 p-6 bg-gray-50">
          <p class="text-sm text-gray-500 uppercase tracking-wide">Nome de usuário</p>
          <p class="mt-2 text-xl font-semibold text-gray-900" th:text="'@' + ${user.username}"></p>
        </div>
        <div class="rounded-3xl border border-gray-200 p-6 bg-gray-50">
          <p class="text-sm text-gray-500 uppercase tracking-wide">E-mail</p>
          <p class="mt-2 text-xl font-semibold text-gray-900" th:text="${user.email}"></p>
        </div>
        <div class="rounded-3xl border border-gray-200 p-6 bg-gray-50">
          <p class="text-sm text-gray-500 uppercase tracking-wide">Nível</p>
          <p class="mt-2 text-xl font-semibold text-gray-900" th:text="${user.level}"></p>
        </div>
      </div>

      <!-- Formulário de edição -->
      <section class="rounded-3xl border border-gray-200 p-6">
        <h2 class="text-lg font-semibold text-gray-900 mb-5">Editar dados</h2>

        <form th:action="@{/profile/edit}" th:object="${profileForm}" method="post" class="space-y-5">
          <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">Nome de usuário</label>
            <input
              th:field="*{username}"
              type="text" id="username" autocomplete="username"
              class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              th:classappend="${#fields.hasErrors('username')} ? 'border-red-400' : ''"
            />
            <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-red-600 text-xs mt-1 block"></span>
          </div>

          <div>
            <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1.5">Nome completo</label>
            <input
              th:field="*{fullName}"
              type="text" id="fullName" autocomplete="name"
              class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              th:classappend="${#fields.hasErrors('fullName')} ? 'border-red-400' : ''"
            />
            <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-red-600 text-xs mt-1 block"></span>
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">E-mail</label>
            <input
              th:field="*{email}"
              type="email" id="email" autocomplete="email"
              class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              th:classappend="${#fields.hasErrors('email')} ? 'border-red-400' : ''"
            />
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-600 text-xs mt-1 block"></span>
          </div>

          <div class="flex gap-3 pt-2">
            <button type="submit"
                    class="px-5 py-2.5 text-sm font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors">
              Salvar alterações
            </button>
            <a th:href="@{/home}"
               class="px-5 py-2.5 text-sm font-medium text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
              Cancelar
            </a>
          </div>
        </form>
      </section>

      <!-- Informações extras -->
      <div class="mt-6 grid gap-4 sm:grid-cols-2">
        <div class="rounded-3xl border border-gray-100 p-5 bg-gray-50">
          <p class="text-xs text-gray-500 uppercase tracking-wide">Conta criada em</p>
          <p class="mt-1 text-sm font-medium text-gray-700"
             th:text="${createdAtFormatted} ?: 'N/A'"></p>
        </div>
        <div class="rounded-3xl border border-gray-100 p-5 bg-gray-50">
          <p class="text-xs text-gray-500 uppercase tracking-wide">ID de usuário</p>
          <p class="mt-1 text-sm font-medium text-gray-700" th:text="${user.id}"></p>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
