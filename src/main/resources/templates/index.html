<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Início')}"></head>
<body class="min-h-screen flex flex-col text-slate-800">

<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="flex-1 content-shell w-full px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex flex-col lg:flex-row gap-8">

        <!-- Coluna principal -->
        <div class="flex-1 min-w-0 space-y-8">

            <!-- Tópicos Populares -->
            <section>
                <h1 class="text-2xl font-bold text-gray-900 mb-5">Tópicos Populares e Recentes</h1>

                <div th:if="${#lists.isEmpty(topicCards)}" class="text-gray-500 text-sm">
                    Nenhum tópico encontrado.
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <article
                        th:each="topic : ${topicCards}"
                        class="surface-card p-5 hover:shadow-md transition-shadow"
                    >
                        <a
                            th:href="@{/forum/topics/{id}(id=${topic.id})}"
                            th:text="${topic.categoryName}"
                            class="inline-block text-xs font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full mb-2 hover:bg-blue-100"
                        ></a>
                        <h2 class="text-base font-semibold text-gray-900 mb-3">
                            <a
                                th:href="@{/forum/topics/{id}(id=${topic.id})}"
                                th:text="${topic.title}"
                                class="hover:text-blue-600"
                            ></a>
                        </h2>
                        <div class="flex items-center gap-3 text-xs text-gray-500">
                            <span th:text="${topic.postCount + ' postagens'}"></span>
                            <span>·</span>
                            <span th:text="${'última ' + topic.lastActivityLabel}"></span>
                        </div>
                    </article>
                </div>
            </section>

            <!-- Chats em Tempo Real -->
            <section>
                <h2 class="text-xl font-bold text-gray-900 mb-4">Chats em Tempo Real</h2>

                <div th:if="${#lists.isEmpty(chatCards)}" class="text-gray-500 text-sm">
                    Nenhum chat ativo no momento.
                </div>

                <div class="space-y-3">
                    <article
                        th:each="chat : ${chatCards}"
                        class="surface-card p-4 flex items-center justify-between gap-4 hover:shadow-md transition-shadow"
                    >
                        <div class="flex items-center gap-4 min-w-0">
                            <span class="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-brand-100 text-[11px] font-extrabold tracking-wider text-brand-700 shrink-0">CHAT</span>
                            <div class="min-w-0">
                                <h3 class="font-semibold text-gray-900 text-sm">
                                    <a
                                        th:href="@{/chat/{id}(id=${chat.id})}"
                                        th:text="${chat.name}"
                                        class="hover:text-blue-600"
                                    ></a>
                                </h3>
                                <p
                                    th:text="${'Tópico: ' + chat.topicTitle}"
                                    class="text-xs text-gray-500 truncate"
                                ></p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 shrink-0">
                            <span class="flex items-center gap-1.5 text-xs text-green-600 font-medium">
                                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                <span th:text="${chat.participantCount + ' Online'}"></span>
                            </span>
                            <a
                                th:href="@{/chat/{id}(id=${chat.id})}"
                                class="px-3 py-1.5 text-xs font-medium text-blue-600 border border-blue-200 rounded-lg hover:bg-blue-50 transition-colors"
                            >Entrar</a>
                        </div>
                    </article>
                </div>
            </section>
        </div>

        <!-- Sidebar -->
        <aside class="w-full lg:w-72 shrink-0 space-y-5">

            <!-- Busca -->
            <div class="surface-card p-4">
                <form action="#" method="get">
                    <label class="sr-only" for="q">Pesquisar</label>
                    <input
                        id="q" name="q" type="search"
                        placeholder="Procure um tópico ou chat..."
                        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                </form>
            </div>

            <!-- Em Alta -->
            <div class="surface-card p-4">
                <h2 class="text-sm font-bold text-gray-900 mb-3 flex items-center gap-2">
                    <span class="inline-flex h-6 min-w-6 items-center justify-center rounded-md bg-amber-100 px-2 text-[10px] font-bold tracking-wide text-amber-700">TOP</span> Em Alta
                </h2>
                <ul class="space-y-2">
                    <li th:each="topic : ${trendingTopics}">
                        <a
                            th:href="@{/forum/topics/{id}(id=${topic.id})}"
                            th:text="${topic.title}"
                            class="text-sm text-gray-700 hover:text-blue-600 line-clamp-2"
                        ></a>
                    </li>
                    <li th:if="${#lists.isEmpty(trendingTopics)}" class="text-sm text-gray-500">
                        Nenhum tópico em destaque.
                    </li>
                </ul>
            </div>

            <!-- CTA não autenticado -->
            <div class="bg-blue-600 rounded-xl p-5 text-white text-center">
                <h3 class="font-bold text-base mb-1">Entre na conversa!</h3>
                <p class="text-blue-100 text-xs mb-4">Crie uma conta para postar, votar e participar dos chats.</p>
                <a th:href="@{/auth/register}" class="block w-full py-2 text-sm font-semibold bg-white text-blue-600 rounded-lg hover:bg-blue-50 transition-colors">
                    Criar conta grátis
                </a>
            </div>
        </aside>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
