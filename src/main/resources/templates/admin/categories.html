<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin - Categorias')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div th:replace="~{fragments/admin-topbar :: adminTopbar}"></div>
<main class="flex-1 max-w-5xl mx-auto px-4 py-10">
  <div class="mb-8">
    <h1 class="text-3xl font-semibold text-gray-900">Administração de Categorias</h1>
    <p class="text-sm text-gray-500 mt-2">Cadastre novas categorias e gerencie as existentes.</p>
  </div>

  <div th:if="${successMessage}" class="mb-6 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-green-700">
    <p th:text="${successMessage}"></p>
  </div>
  <div th:if="${errorMessage}" class="mb-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-red-700">
    <p th:text="${errorMessage}"></p>
  </div>

  <section class="grid gap-8 lg:grid-cols-2">
    <!-- Formulário nova categoria -->
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-200">
      <h2 class="text-xl font-semibold text-gray-900 mb-4">Nova Categoria</h2>
      <form th:action="@{/admin/categories}" th:object="${categoryForm}" method="post" class="space-y-5">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Nome <span class="text-red-500">*</span></label>
          <input
            th:field="*{name}"
            type="text" id="name"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100"
            th:classappend="${#fields.hasErrors('name')} ? 'border-red-400' : ''"
            placeholder="Ex: Java"
          />
          <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
        <div>
          <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Descrição</label>
          <textarea
            th:field="*{description}"
            id="description" rows="4"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100"
            th:classappend="${#fields.hasErrors('description')} ? 'border-red-400' : ''"
            placeholder="Descrição opcional"
          ></textarea>
          <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
        <button type="submit" class="inline-flex items-center justify-center rounded-xl bg-blue-600 px-5 py-3 text-sm font-semibold text-white hover:bg-blue-700 transition">
          Salvar Categoria
        </button>
      </form>
    </div>

    <!-- Lista de categorias -->
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-200">
      <h2 class="text-xl font-semibold text-gray-900 mb-4">Categorias Existentes</h2>
      <div th:if="${#lists.isEmpty(categories)}" class="text-gray-500">Nenhuma categoria cadastrada ainda.</div>
      <ul class="space-y-3" th:if="${!#lists.isEmpty(categories)}">
        <li th:each="category : ${categories}" class="rounded-2xl border border-gray-200 p-4 flex items-start justify-between gap-3">
          <div class="flex-1 min-w-0">
            <div class="font-semibold text-gray-900" th:text="${category.name}"></div>
            <p class="text-sm text-gray-500 mt-1 truncate"
               th:text="${category.description != null && !#strings.isEmpty(category.description) ? category.description : 'Sem descrição.'}"></p>
          </div>
          <form th:action="@{/admin/categories/{id}/delete(id=${category.id})}" method="post" class="flex-shrink-0">
            <button type="submit"
                    onclick="return confirm('Excluir esta categoria?')"
                    class="px-3 py-1.5 text-xs font-medium text-red-600 border border-red-200 rounded-lg hover:bg-red-50 transition">
              Excluir
            </button>
          </form>
        </li>
      </ul>
    </div>
  </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
