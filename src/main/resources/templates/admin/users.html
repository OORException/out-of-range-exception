<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin - Usuários')}"></head>
<body class="min-h-screen flex flex-col text-slate-800">
<div th:replace="~{fragments/admin-topbar :: adminTopbar}"></div>
<main class="flex-1 content-shell max-w-5xl mx-auto px-4 py-10">
  <div class="mb-8">
    <h1 class="text-3xl font-semibold text-gray-900">Administração de Usuários</h1>
    <p class="text-sm text-gray-500 mt-2">Usuários cadastrados na plataforma.</p>
  </div>

  <div th:if="${successMessage}" class="mb-6 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-green-700">
    <p th:text="${successMessage}"></p>
  </div>

  <div class="surface-card p-6">
    <h2 class="text-xl font-semibold text-gray-900 mb-4">Lista de Usuários</h2>

    <div th:if="${#lists.isEmpty(users)}" class="text-gray-500">
      Nenhum usuário cadastrado.
    </div>

    <div class="overflow-x-auto" th:if="${!#lists.isEmpty(users)}">
      <table class="w-full text-sm min-w-[720px]">
        <thead>
          <tr class="border-b border-gray-200 text-left">
            <th class="pb-3 font-semibold text-gray-600">ID</th>
            <th class="pb-3 font-semibold text-gray-600">Nome de usuário</th>
            <th class="pb-3 font-semibold text-gray-600">Nome completo</th>
            <th class="pb-3 font-semibold text-gray-600">E-mail</th>
            <th class="pb-3 font-semibold text-gray-600">Nível</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <tr th:each="user : ${users}" class="hover:bg-gray-50 transition">
            <td class="py-3 text-gray-400" th:text="${user.id}"></td>
            <td class="py-3 font-medium text-gray-900" th:text="${user.username}"></td>
            <td class="py-3 text-gray-700" th:text="${user.fullName}"></td>
            <td class="py-3 text-gray-500" th:text="${user.email}"></td>
            <td class="py-3">
              <span th:if="${user.level.name() == 'ADMIN'}"
                    class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-700">
                Admin
              </span>
              <span th:if="${user.level.name() == 'USER'}"
                    class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-700">
                Usuário
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
