<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin - Usuários')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div th:replace="~{fragments/topbar :: topbar}"></div>
<main class="flex-1 max-w-5xl mx-auto px-4 py-10">
  <div class="mb-8">
    <h1 class="text-3xl font-semibold text-gray-900">Administração de Usuários</h1>
    <p class="text-sm text-gray-500 mt-2">Veja os usuários cadastrados. Apenas administradores autenticados podem carregar a lista.</p>
  </div>

  <div th:if="${successMessage}" class="mb-6 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-green-700">
    <p th:text="${successMessage}"></p>
  </div>
  <div th:if="${errorMessage}" class="mb-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-red-700">
    <p th:text="${errorMessage}"></p>
  </div>

  <div id="users-error" class="hidden mb-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-red-700"></div>

  <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-200">
    <h2 class="text-xl font-semibold text-gray-900 mb-4">Lista de Usuários</h2>
    <div id="users-loading" class="text-gray-500">Carregando usuários...</div>
    <div id="users-empty" class="hidden text-gray-500">Nenhum usuário encontrado.</div>
    <div id="users-list" class="space-y-3"></div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script>
  async function loadUsers() {
    const token = localStorage.getItem('token');
    const errorEl = document.getElementById('users-error');
    const loadingEl = document.getElementById('users-loading');
    const emptyEl = document.getElementById('users-empty');
    const listEl = document.getElementById('users-list');

    errorEl.classList.add('hidden');
    emptyEl.classList.add('hidden');
    listEl.innerHTML = '';

    if (!token) {
      loadingEl.textContent = 'Você precisa estar autenticado para carregar os usuários.';
      return;
    }

    try {
      const response = await fetch('/api/v1/users', {
        headers: {
          'Authorization': 'Bearer ' + token
        }
      });

      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        errorEl.textContent = body.message || 'Erro ao carregar os usuários.';
        errorEl.classList.remove('hidden');
        loadingEl.classList.add('hidden');
        return;
      }

      const users = await response.json();
      loadingEl.classList.add('hidden');

      if (!Array.isArray(users) || users.length === 0) {
        emptyEl.classList.remove('hidden');
        return;
      }

      users.forEach(user => {
        const item = document.createElement('div');
        item.className = 'rounded-2xl border border-gray-200 p-4';
        item.innerHTML = `
          <div class="font-semibold text-gray-900">${user.fullName || user.username}</div>
          <p class="text-sm text-gray-500">Email: ${user.email}</p>
          <p class="text-sm text-gray-500">Nível: ${user.level}</p>
        `;
        listEl.appendChild(item);
      });
    } catch (error) {
      loadingEl.classList.add('hidden');
      errorEl.textContent = 'Falha de rede ao carregar os usuários.';
      errorEl.classList.remove('hidden');
    }
  }

  loadUsers();
</script>
</body>
</html>
