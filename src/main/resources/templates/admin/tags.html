<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin - Tags')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div th:replace="~{fragments/admin-topbar :: adminTopbar}"></div>
<main class="flex-1 max-w-5xl mx-auto px-4 py-10">
  <div class="mb-8">
    <h1 class="text-3xl font-semibold text-gray-900">Administração de Tags</h1>
    <p class="text-sm text-gray-500 mt-2">Cadastre novas tags e gerencie as existentes.</p>
  </div>

  <div th:if="${successMessage}" class="mb-6 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-green-700">
    <p th:text="${successMessage}"></p>
  </div>
  <div th:if="${errorMessage}" class="mb-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-red-700">
    <p th:text="${errorMessage}"></p>
  </div>

  <section class="grid gap-8 lg:grid-cols-2">
    <!-- Formulário nova tag -->
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-200">
      <h2 class="text-xl font-semibold text-gray-900 mb-4">Nova Tag</h2>
      <form th:action="@{/admin/tags}" th:object="${tagForm}" method="post" class="space-y-5">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Nome <span class="text-red-500">*</span></label>
          <input
            th:field="*{name}"
            type="text" id="name"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100"
            th:classappend="${#fields.hasErrors('name')} ? 'border-red-400' : ''"
            placeholder="Ex: springboot"
          />
          <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
        <button type="submit" class="inline-flex items-center justify-center rounded-xl bg-blue-600 px-5 py-3 text-sm font-semibold text-white hover:bg-blue-700 transition">
          Salvar Tag
        </button>
      </form>
    </div>

    <!-- Lista de tags -->
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-200">
      <h2 class="text-xl font-semibold text-gray-900 mb-4">Tags Existentes</h2>
      <div th:if="${#lists.isEmpty(tags)}" class="text-gray-500">Nenhuma tag cadastrada ainda.</div>
      <ul class="space-y-3" th:if="${!#lists.isEmpty(tags)}">
        <li th:each="tag : ${tags}" class="rounded-2xl border border-gray-200 p-4 flex items-center justify-between gap-3">
          <span class="font-semibold text-gray-900" th:text="${tag.name}"></span>
          <form th:action="@{/admin/tags/{id}/delete(id=${tag.id})}" method="post" class="flex-shrink-0">
            <button type="submit"
                    onclick="return confirm('Excluir esta tag?')"
                    class="px-3 py-1.5 text-xs font-medium text-red-600 border border-red-200 rounded-lg hover:bg-red-50 transition">
              Excluir
            </button>
          </form>
        </li>
      </ul>
    </div>
  </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
