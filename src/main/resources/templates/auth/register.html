<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Criar conta')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8">
            <div class="text-center mb-8">
                <span class="text-4xl">💬</span>
                <h1 class="text-2xl font-bold text-gray-900 mt-3">Crie sua conta</h1>
                <p class="text-sm text-gray-500 mt-1">Junte-se à comunidade FórumOnline</p>
            </div>

            <div id="error-message" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-6"></div>

            <form id="register-form" class="space-y-5" novalidate>
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">Nome de usuário</label>
                    <input
                        type="text" id="username" name="username" required autocomplete="username"
                        class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="seunome123"
                    />
                </div>

                <div>
                    <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1.5">Nome completo</label>
                    <input
                        type="text" id="fullName" name="fullName" required autocomplete="name"
                        class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Seu Nome Completo"
                    />
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">E-mail</label>
                    <input
                        type="email" id="email" name="email" required autocomplete="email"
                        class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="seu@email.com"
                    />
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Senha</label>
                    <input
                        type="password" id="password" name="password" required autocomplete="new-password"
                        class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Mínimo 8 caracteres"
                    />
                </div>

                <button
                    type="submit"
                    class="w-full py-2.5 text-sm font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-60 disabled:cursor-not-allowed"
                >
                    Criar conta
                </button>
            </form>

            <p class="text-center text-sm text-gray-500 mt-6">
                Já tem uma conta?
                <a th:href="@{/auth/login}" class="font-medium text-blue-600 hover:text-blue-700">Entrar</a>
            </p>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    document.getElementById('register-form').addEventListener('submit', async function (e) {
        e.preventDefault();

        const btn = this.querySelector('button[type="submit"]');
        const errorEl = document.getElementById('error-message');

        const username = document.getElementById('username').value.trim();
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        errorEl.classList.add('hidden');
        errorEl.textContent = '';
        btn.disabled = true;
        btn.textContent = 'Criando conta...';

        try {
            const res = await fetch('/api/v1/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, fullName, email, password })
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('token', data.token);
                window.location.href = '/home';
            } else {
                const body = await res.json().catch(() => ({}));
                errorEl.textContent = body.message || 'Erro ao criar conta. Verifique os dados e tente novamente.';
                errorEl.classList.remove('hidden');
            }
        } catch {
            errorEl.textContent = 'Erro de conexão. Tente novamente.';
            errorEl.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Criar conta';
        }
    });
</script>

</body>
</html>
