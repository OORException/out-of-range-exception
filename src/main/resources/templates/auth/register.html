<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Criar conta')}"></head>
<body class="min-h-screen flex flex-col text-slate-800">

<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="surface-card p-8">
            <div class="text-center mb-8">
                <span class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-brand-100 text-xs font-extrabold tracking-wider text-brand-700">FO</span>
                <h1 class="text-2xl font-bold text-gray-900 mt-3">Crie sua conta</h1>
                <p class="text-sm text-gray-500 mt-1">Junte-se à comunidade FórumOnline</p>
            </div>

            <div th:if="${errorMessage}" class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-6" th:text="${errorMessage}"></div>

            <form th:action="@{/auth/register}" th:object="${registerForm}" method="post" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">Nome de usuário</label>
                    <input
                        th:field="*{username}"
                        type="text" id="username" autocomplete="username"
                        class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        th:classappend="${#fields.hasErrors('username')} ? 'border-red-400' : ''"
                        placeholder="seunome123"
                    />
                    <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-red-600 text-xs mt-1 block"></span>
                </div>

                <div>
                    <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1.5">Nome completo</label>
                    <input
                        th:field="*{fullName}"
                        type="text" id="fullName" autocomplete="name"
                        class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        th:classappend="${#fields.hasErrors('fullName')} ? 'border-red-400' : ''"
                        placeholder="Seu Nome Completo"
                    />
                    <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-red-600 text-xs mt-1 block"></span>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">E-mail</label>
                    <input
                        th:field="*{email}"
                        type="email" id="email" autocomplete="email"
                        class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        th:classappend="${#fields.hasErrors('email')} ? 'border-red-400' : ''"
                        placeholder="seu@email.com"
                    />
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-600 text-xs mt-1 block"></span>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Senha</label>
                    <input
                        th:field="*{password}"
                        type="password" id="password" autocomplete="new-password"
                        class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        th:classappend="${#fields.hasErrors('password')} ? 'border-red-400' : ''"
                        placeholder="Mínimo 8 caracteres"
                    />
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-600 text-xs mt-1 block"></span>
                </div>

                <button
                    type="submit"
                    class="w-full py-2.5 text-sm font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                >
                    Criar conta
                </button>
            </form>

            <p class="text-center text-sm text-gray-500 mt-6">
                Já tem uma conta?
                <a th:href="@{/auth/login}" class="font-medium text-blue-600 hover:text-blue-700">Entrar</a>
            </p>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
